<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фізика 8 клас НУШ — Навчальні матеріали</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 12px;
        }
        .lesson-card {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.2s;
            text-decoration: none;
            color: #475569;
            background-color: white;
        }
        .lesson-card:hover {
            background-color: #4f46e5;
            border-color: #4f46e5;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .text-justify {
            text-align: justify;
        }
        /* Стилі та анімація для обкладинки підручника */
        .book-cover-container {
            flex-shrink: 0;
            width: 150px;
            margin: 0 auto;
            perspective: 1000px;
        }
        .book-cover {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            display: block;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.5s;
        }
        .book-cover:hover {
            transform: rotateY(-15deg) rotateX(5deg) scale(1.05);
            box-shadow: 20px 20px 30px rgba(0,0,0,0.2);
        }
        @media (min-width: 768px) {
            .book-cover-container {
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

    <div class="max-w-5xl mx-auto px-4 py-12">
        
        <!-- Шапка сторінки -->
        <header class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-10 mb-10">
            <div class="flex flex-col md:flex-row gap-8 items-center md:items-start">
                
                <!-- Блок з фото підручника -->
                <div class="book-cover-container">
                    <img src="cover_70_1.png" alt="Обкладинка підручника Фізика 8 клас" class="book-cover" onerror="this.onerror=null; this.src='https://placehold.co/150x200?text=Фізика+8';">
                </div>

                <div class="flex-1">
                    <h1 class="text-3xl font-bold text-slate-900 mb-6 flex items-center gap-3 justify-center md:justify-start">
                        📚 Фізика 8 клас (НУШ)
                    </h1>
                    
                    <div class="space-y-4 text-lg text-slate-600 leading-relaxed border-l-4 border-indigo-500 pl-6 text-justify">
                        <p>
                            <strong>Вітаю на головній сторінці курсу фізики для 8 класу за програмою НУШ.</strong>
                        </p>
                        <p>
                            Тут зібрані всі уроки, лабораторні роботи та проєкти. Для швидкого переходу до потрібного матеріалу натисніть на відповідний номер уроку нижче.
                        </p>
                    </div>
                    
                    <div class="mt-8 flex flex-wrap gap-4 justify-center md:justify-start">
                        <div class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-full text-sm font-semibold border border-indigo-100">
                            105 уроків
                        </div>
                        <div class="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-full text-sm font-semibold border border-emerald-100">
                            НУШ 2025/26
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Пошук -->
        <div class="mb-10 max-w-md mx-auto md:mx-0">
            <label for="search" class="block text-sm font-medium text-slate-700 mb-2 ml-1">Швидкий пошук номера:</label>
            <div class="relative">
                <input 
                    type="text" 
                    id="search" 
                    placeholder="Введіть номер уроку" 
                    class="w-full px-5 py-4 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all shadow-sm"
                    onkeyup="filterLessons()"
                >
            </div>
        </div>

        <!-- Інтерактивна сітка -->
        <div id="grid" class="lesson-grid">
            <!-- Кнопки будуть згенеровані скриптом -->
        </div>

        <footer class="mt-20 py-10 border-t border-slate-200 text-center text-slate-400 text-sm">
            <p>© Онлайн-кабінет фізики 229</p>
        </footer>
    </div>

    <script>
        // Конфігурація
        const TOTAL_LESSONS = 105; 

        function generateGrid() {
            const grid = document.getElementById('grid');
            if (!grid) return;
            
            grid.innerHTML = ''; 
            
            for (let i = 1; i <= TOTAL_LESSONS; i++) {
                // Посилання веде на i.html (наприклад, 75.html)
                const fileName = i + '.html';
                const displayTitle = i.toString();
                
                const a = document.createElement('a');
                a.href = fileName;
                a.className = 'lesson-card';
                a.textContent = displayTitle;
                a.setAttribute('data-num', displayTitle);
                
                // Додаємо обробник помилок, якщо файл не знайдено (опціонально)
                a.onclick = function(e) {
                    // Можна додати логіку перевірки, але для GitHub Pages 
                    // просто дозволяємо стандартний перехід
                };
                
                grid.appendChild(a);
            }
        }

        function filterLessons() {
            const input = document.getElementById('search');
            const filter = input.value.toLowerCase();
            const cards = document.querySelectorAll('.lesson-card');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                // Точний пошук або входження номера
                card.style.display = text.includes(filter) ? "flex" : "none";
            });
        }

        // Запуск генерації після завантаження DOM
        window.onload = function() {
            generateGrid();
        };

        // Запасний запуск через таймер, якщо onload затримається
        setTimeout(function() {
            const grid = document.getElementById('grid');
            if (grid && grid.children.length === 0) {
                generateGrid();
            }
        }, 500);
    </script>

</body>
</html>
