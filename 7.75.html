<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перегляд draw74.3.png</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
        }
        #image-preview {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
            display: none;
            border: 2px solid #e5e7eb;
        }
        .upload-area {
            border: 2px dashed #3b82f6;
            padding: 2rem;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-area:hover {
            background-color: #eff6ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Завантаження зображення</h1>
        <p class="text-gray-600 mb-6">Оберіть файл <code class="bg-gray-100 px-1 rounded">draw74.3.png</code> з вашої папки, щоб відобразити його тут.</p>
        
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <p class="text-blue-600 font-medium">Натисніть тут, щоб вибрати файл</p>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleImage(this)">
        </div>

        <div id="status-message" class="mt-4 text-sm text-gray-500">Очікування файлу...</div>
        
        <img id="image-preview" alt="Попередній перегляд draw74.3.png">
        
        <div class="mt-6 pt-6 border-t border-gray-100">
            <p class="text-xs text-gray-400">Примітка: Через обмеження безпеки, веб-сторінки не можуть автоматично читати файли з вашого диска без вашого дозволу.</p>
        </div>
    </div>

    <script>
        function handleImage(input) {
            const file = input.files[0];
            const preview = document.getElementById('image-preview');
            const status = document.getElementById('status-message');

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    status.textContent = `Файл "${file.name}" успішно завантажено!`;
                    status.className = "mt-4 text-sm text-green-600 font-bold";
                };

                reader.onerror = function() {
                    status.textContent = "Помилка при зчитуванні файлу.";
                    status.className = "mt-4 text-sm text-red-600";
                };

                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
